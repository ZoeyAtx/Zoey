<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Segment Display</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">

        <div class="seven-segment-display">
            <div class="segment horizontal a"></div>
            <div class="segment vertical b"></div>
            <div class="segment vertical c"></div>
            <div class="segment horizontal d"></div>
            <div class="segment vertical e"></div>
            <div class="segment vertical f"></div>
            <div class="segment horizontal g"></div>
            <!-- second display -->
            <div class="segment horizontal h"></div>
            <div class="segment vertical i"></div>
            <div class="segment vertical j"></div>
            <div class="segment horizontal k"></div>
            <div class="segment vertical l"></div>
            <div class="segment vertical m"></div>
            <div class="segment horizontal n"></div>
        </div>
                <div class="segment-controls">
            <label class="switch">
                <input type="checkbox" id="toggle-1" class="toggle" />
                <span class="slider round"></span>
            </label>
            <label class="switch">
                <input type="checkbox" id="toggle-2" class="toggle" />
                <span class="slider round"></span>
            </label>
            <label class="switch">
                <input type="checkbox" id="toggle-3" class="toggle" />
                <span class="slider round"></span>
            </label>
            <label class="switch">
                <input type="checkbox" id="toggle-4" class="toggle" />
                <span class="slider round"></span>
            </label>
            <label class="switch">
                <input type="checkbox" id="toggle-5" class="toggle" />
                <span class="slider round"></span>
            </label>
        </div>
    </div>
</body>

</html>
